spring.application.name=cinemahub
server.port=5000
server.address=127.0.0.1

spring.mongodb.uri=mongodb://127.0.0.1:27017/cinemahub
spring.mongodb.database=cinemahub

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VNPAY Sandbox Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:5173/payment-callback}
vnpay.enabled=${VNPAY_ENABLED:false}
app.seed-users=false
app.seed-data=false

# Set BOOKING_HOLD_SECONDS=30 and PAYMENT_TIMEOUT_SCAN_MS=1000 for local timeout tests.
booking.hold-seconds=${BOOKING_HOLD_SECONDS:600}

payment.timeout.scan-ms=${PAYMENT_TIMEOUT_SCAN_MS:30000}
