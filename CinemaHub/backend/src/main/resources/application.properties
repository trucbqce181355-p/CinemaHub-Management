spring.application.name=cinemahub
server.port=5000
server.address=127.0.0.1

spring.mongodb.uri=mongodb://127.0.0.1:27017/cinemahub
spring.mongodb.database=cinemahub

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VNPAY Sandbox Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:1HJW7RTO}
vnpay.hashSecret=${VNPAY_HASH_SECRET:VBBBDAZMGNSFVTAQPCQXSXIDASDWVGTY}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:5173/payment-callback
vnpay.enabled=${VNPAY_ENABLED:true}

app.seed-users=true
app.seed-data=true
# Set BOOKING_HOLD_SECONDS=30 and PAYMENT_TIMEOUT_SCAN_MS=1000 for local timeout tests.
booking.hold-seconds=${BOOKING_HOLD_SECONDS:600}

payment.timeout.scan-ms=${PAYMENT_TIMEOUT_SCAN_MS:30000}

# Tickets can be checked in from this many minutes before start until showtime end.
ticket.check-in.early-minutes=${TICKET_CHECK_IN_EARLY_MINUTES:30}
ticket.check-in.gate=${TICKET_CHECK_IN_GATE:Main Gate 1}
